# 주인: BE-A (설정 추가 시 PR 설명에 명시)
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  ai:
    server-url: ${AI_SERVER_URL}
    mock: ${AI_MOCK:true}
  seoul:
    openapi-key: ${SEOUL_OPENAPI_KEY:}
    base-url: http://openapi.seoul.go.kr:8088
    job-service: recMntList
    page-size: 1000
    # 공고 일 배치 시각 (KST). 키가 비어 있으면 실행하지 않음
    sync-cron: "0 0 6 * * *"
    # IT 직종 코드 (JOBS_CD). 2026-10-25 전체 42,141건 분포 기준 · docs/JOB_API.md "IT 직종 필터"
    # 비워 두면 JOBS_NM 단어 필터로 대신함
    it-job-codes:
      - "131201"  # 통신기기·장비 개발자 및 연구원
      - "131202"  # 통신기술 개발자 및 통신망 운영 기술자
      - "132001"  # IT 컨설턴트
      - "133100"  # 시스템 소프트웨어 개발자
      - "133101"  # 시스템 소프트웨어 개발자(프로그래머)
      - "133102"  # 펌웨어 및 임베디드 소프트웨어 프로그래머
      - "133200"  # 응용 소프트웨어 개발자
      - "133203"  # 범용 응용 소프트웨어 프로그래머
      - "133204"  # 산업특화 응용 소프트웨어 프로그래머
      - "133207"  # 모바일 애플리케이션 프로그래머
      - "133300"  # 웹 개발자
      - "133301"  # 웹 개발자(웹 엔지니어·웹 프로그래머)
      - "133302"  # 웹 기획자
      - "133900"  # 기타 컴퓨터 시스템 및 소프트웨어 전문가(IT 테스터 · QA)
      - "134100"  # 네트워크 시스템 개발자
      - "134200"  # 정보보안 전문가
      - "134900"  # 기타 네트워크 및 정보 보안 전문가
      - "135101"  # 데이터 설계 및 프로그래머
      - "135102"  # 데이터베이스 운영·관리자
      - "136101"  # 정보시스템 운영자
      - "136102"  # 네트워크 관리자
      - "136103"  # IT 기술지원 전문가
      - "136200"  # 웹 운영자(홈페이지 관리자)
      - "415501"  # 웹 디자이너 (프론트엔드 · UI 지망생 후보, 2026-10-27 추가)
    # 저장할 근무 지역 (REGION 첫 단어, "경기도" → "경기"로 맞춘 뒤 비교). 비워 두면 거르지 않음
    allowed-regions: ["서울", "경기", "인천"]
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
